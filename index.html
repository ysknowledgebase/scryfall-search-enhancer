<!-- 2. Attributes Section (Textbox Filters) -->

<div class="option-group" id="attributeGroup">

  <!-- Mana Value -->
  <div class="attribute-filter-row">

    <span class="attribute-title">CMC</span>

    <input
      type="number"
      id="cmcLowerInput"
      class="attr-input"
      placeholder=""
    >

    <button
      type="button"
      id="cmcLowerOp"
      class="attr-op-btn"
    ><</button>

    <span class="attr-center-label">CMC</span>

    <button
      type="button"
      id="cmcUpperOp"
      class="attr-op-btn"
    ><</button>

      type="number"
      id="cmcUpperInput"
      class="attr-input"
      placeholder=""
    >

    <button class="clear-btn" id="clearCmc">Clear</button>

  </div>

  <!-- Power -->
  <div class="attribute-filter-row">

    <span class="attribute-title">POW</span>

    <input
      type="number"
      id="powLowerInput"
      class="attr-input"
      placeholder=""
    >

    <button
      type="button"
      id="powLowerOp"
      class="attr-op-btn"
    ><</button>

    <span class="attr-center-label">POW</span>

    <button
      type="button"
      id="powUpperOp"
      class="attr-op-btn"
    ><</button>

    <input
      type="number"
      id="powUpperInput"
      class="attr-input"
      placeholder=""
    >

    <button class="clear-btn" id="clearPow">Clear</button>

  </div>

  <!-- Toughness -->
  <div class="attribute-filter-row">

    <span class="attribute-title">TOU</span>

    <input
      type="number"
      id="touLowerInput"
      class="attr-input"
      placeholder=""

    <button
      type="button"
      id="touLowerOp"

    ><</button>

    <span class="attr-center-label">TOU</span>

    <button
      type="button"
      id="touUpperOp"
      class="attr-op-btn"
    ><</button>

    <input
      type="number"
      id="touUpperInput"
      class="attr-input"
      placeholder=""
    >

    <button class="clear-btn" id="clearTou">Clear</button>

  </div>
