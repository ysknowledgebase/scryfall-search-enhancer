<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Scryfall Enhancer</title>

  <link rel="stylesheet" href="styles.css" />
</head>

<body>

  <div id="enhancer-container">

    <div id="versionIndicator">v0.6.01</div>

    <!-- FORMAT -->
    <div class="option-group">

      <label>Format</label>

      <div class="selector-row">

        <select id="format_selector"></select>

        <button
          type="button"
          id="addFormatButton"
        >
          +
        </button>

      </div>

    </div>

    <!-- COLORS -->
    <div class="option-group">

      <label>Colors</label>

      <div class="selector-row">

        <div id="colorButtons">

          <button class="color-btn" data-color="W"></button>
          <button class="color-btn" data-color="U"></button>
          <button class="color-btn" data-color="B"></button>
          <button class="color-btn" data-color="R"></button>
          <button class="color-btn" data-color="G"></button>
          <button class="color-btn" data-color="C"></button>

        </div>

        <button
          type="button"
          id="colorToggle"
          class="toggle-btn"
        >
          At Most
        </button>

      </div>

      <div style="display:none">

        <input type="checkbox" name="color[]" value="W">
        <input type="checkbox" name="color[]" value="U">
        <input type="checkbox" name="color[]" value="B">
        <input type="checkbox" name="color[]" value="R">
        <input type="checkbox" name="color[]" value="G">
        <input type="checkbox" name="color[]" value="C">

      </div>

    </div>

    <!-- TYPES -->
    <div class="option-group">

      <label>Types</label>

      <div id="typeButtons">

        <button class="type-btn" data-type="artifact">AR</button>
        <button class="type-btn" data-type="enchantment">EN</button>
        <button class="type-btn" data-type="aura">AU</button>
        <button class="type-btn" data-type="creature">CR</button>
        <button class="type-btn" data-type="sorcery">SR</button>
        <button class="type-btn" data-type="instant">IN</button>
        <button class="type-btn" data-type="equipment">EQ</button>
        <button class="type-btn" data-type="land">LD</button>
        <button class="type-btn" data-type="planeswalker">PW</button>

      </div>

    </div>

    <!-- RARITIES -->
    <div class="option-group">

      <label>Rarity</label>

      <div id="rarityButtons">

        <button class="rarity-btn" data-rarity="C">C</button>
        <button class="rarity-btn" data-rarity="U">U</button>
        <button class="rarity-btn" data-rarity="R">R</button>
        <button class="rarity-btn" data-rarity="M">M</button>

      </div>

      <div style="display:none">

        <input type="checkbox" name="rarity[]" value="C">
        <input type="checkbox" name="rarity[]" value="U">
        <input type="checkbox" name="rarity[]" value="R">
        <input type="checkbox" name="rarity[]" value="M">

      </div>

    </div>

    <!-- CMC -->
    <div class="option-group">

      <label>Mana Value (CMC)</label>

      <div class="attribute-box">

        <input
          type="number"
          id="cmcMin"
          class="attribute-input"
          placeholder="Min"
        >

        <button
          type="button"
          id="cmcMinOp"
          class="operator-btn"
        >
          <=
        </button>

        <div class="attribute-center">
          CMC
        </div>

        <button
          type="button"
          id="cmcMaxOp"
          class="operator-btn"
        >
          <=
        </button>

        <input
          type="number"
          id="cmcMax"
          class="attribute-input"
          placeholder="Max"
        >

      </div>

    </div>

    <!-- POWER -->
    <div class="option-group">

      <label>Power (POW)</label>

      <div class="attribute-box">

        <input
          type="number"
          id="powMin"
          class="attribute-input"
          placeholder="Min"
        >

        <button
          type="button"
          id="powMinOp"
          class="operator-btn"
        >
          <=
        </button>

        <div class="attribute-center">
          POW
        </div>

        <button
          type="button"
          id="powMaxOp"
          class="operator-btn"
        >
          <=
        </button>

        <input
          type="number"
          id="powMax"
          class="attribute-input"
          placeholder="Max"
        >

      </div>

    </div>

    <!-- TOUGHNESS -->
    <div class="option-group">

      <label>Toughness (TOU)</label>

      <div class="attribute-box">

        <input
          type="number"
          id="touMin"
          class="attribute-input"
          placeholder="Min"
        >

        <button
          type="button"
          id="touMinOp"
          class="operator-btn"
        >
          <=
        </button>

        <div class="attribute-center">
          TOU
        </div>

        <button
          type="button"
          id="touMaxOp"
          class="operator-btn"
        >
          <=
        </button>

        <input
          type="number"
          id="touMax"
          class="attribute-input"
          placeholder="Max"
        >

      </div>

    </div>

    <!-- ORACLE -->
    <div class="option-group">

      <label>Oracle Text</label>

      <textarea id="oracle"></textarea>

    </div>

    <!-- SEARCH -->
    <div id="searchButtons">

      <button
        id="searchActionButton"
        class="action-btn"
      >
        Search
      </button>

    </div>

  </div>

  <script src="app.js"></script>

</body>
</html>
